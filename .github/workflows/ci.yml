name: QA Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🎭 Instalar browsers do Playwright
        run: npx playwright install --with-deps

      # =========================
      # PREPARAÇÃO DE DIRETÓRIOS
      # =========================
      - name: 📁 Criar estrutura de reports
        run: |
          mkdir -p reports/screenshots
          mkdir -p reports/videos
          mkdir -p reports/k6
          mkdir -p public

      # =========================
      # API TESTS
      # =========================
      - name: ⚙️ Rodar testes API
        run: npm run test:api
        continue-on-error: true

      # =========================
      # E2E TESTS
      # =========================
      - name: 🧪 Rodar testes E2E
        run: npm run test:e2e
        continue-on-error: true

      - name: 🔍 Debug evidências
        run: |
          echo "📁 Screenshots:"
          ls -R reports/screenshots || true

          echo "📁 Videos:"
          ls -R reports/videos || true

      # =========================
      # PERFORMANCE (K6)
      # =========================
      - name: 🚀 Run K6 tests
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

          k6 run performance/load-test.js \
            --summary-export=reports/k6/k6-summary.json \
            > reports/k6/k6-log.txt

      # =========================
      # REPORTS - CUCUMBER
      # =========================
      - name: 📊 Gerar relatório HTML
        if: always()
        run: npm run report

      # =========================
      # K6 HTML REPORT (CORRIGIDO)
      # =========================
      - name: 📊 Criar K6 HTML report
        run: |
          echo "<html><body><h1>⚡ K6 Summary</h1><pre>" > reports/k6/k6-report.html
          cat reports/k6/k6-summary.json | jq . >> reports/k6/k6-report.html
          echo "</pre></body></html>" >> reports/k6/k6-report.html

      # =========================
      # SCREENSHOTS INDEX
      # =========================
      - name: 📸 Criar index de screenshots
        run: |
          echo "<h1>📸 Screenshots</h1>" > reports/screenshots/index.html

          for file in reports/screenshots/*.png; do
            name=$(basename "$file")
            echo "<div style='margin-bottom:20px'>
                    <p>$name</p>
                    <img src=\"$name\" style='width:400px;border-radius:8px'/>
                  </div>" >> reports/screenshots/index.html
          done

      # =========================
      # VIDEOS INDEX
      # =========================
      - name: 🎥 Criar index de vídeos
        run: |
          echo "<h1>🎥 Videos</h1>" > reports/videos/index.html

          for file in reports/videos/*.webm; do
            name=$(basename "$file")
            echo "<div style='margin-bottom:20px'>
                    <p>$name</p>
                    <video controls width='400'>
                      <source src=\"$name\" type='video/webm'>
                    </video>
                  </div>" >> reports/videos/index.html
          done

      # =========================
      # DASHBOARD ENTRYPOINT
      # =========================
      - name: 🧱 Preparar dashboard
        run: |
          cp reports/index.html public/index.html
          cp -r reports/screenshots public/
          cp -r reports/videos public/
          cp -r reports/k6 public/
          cp reports/k6/k6-summary.json public/

      # =========================
      # DEBUG FINAL
      # =========================
      - name: 🔍 Debug public folder
        run: ls -R public

      # =========================
      # ARTIFACTS
      # =========================
      - name: 📁 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.run_id }}
          path: |
            reports/
            test-results/

  # =========================
  # DEPLOY GH PAGES
  # =========================
  deploy:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-reports-${{ github.run_id }}
          path: .

      - name: 📦 Preparar deploy
        run: |
          mkdir -p public
          cp -r reports/* public/

      - name: 🔍 Debug final
        run: ls -R public

      - name: 🚀 Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          force_orphan: true